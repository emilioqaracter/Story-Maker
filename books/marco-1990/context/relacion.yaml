# El arco de la pareja. La etapa se calcula a una fecha, igual que la edad.
entre: [marco, sofia]
encuentro: "Ella lo atiende de una lesion que el esconde para no perder el puesto"
obstaculo: "Si ella firma el parte medico, el pierde la temporada; si no lo firma, ella pierde la matricula"
etapas:
  - { etapa: desconocidos, desde: 1990-01-01 }
  - { etapa: atraccion,    desde: 1990-02-11 }
  - { etapa: intimidad,    desde: 1990-05-03 }
  - { etapa: ruptura,      desde: 1990-08-20 }
  - { etapa: union,        desde: 1990-11-25 }
