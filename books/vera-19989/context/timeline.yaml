escenas:
- id: S001
  capitulo: 1
  fecha: '1998-12-13'
  lugar: Montevideo, Uruguay
  presentes:
  - vera
  - ruben
  resumen: 'Vera y Ruben vuelven al gimnasio del barrio la noche antes de la demolicion,
    y ahi cierran la lista de doce: el la deja fuera con el nombre firmado por otro
    y ella acepta retirarse de pie, junto a el.'
  estado: aprobada
  cierra:
  - H1
  - H2
  flashback: false
  beats:
  - 'Ruben llega al gimnasio con el acta de la lista ya sellada y le muestra a Vera
    que su nombre no esta: firmo la convocatoria sin ella y presento su renuncia al
    puesto el mismo dia, para que nadie pueda decir que la eligio por amor ni que
    la dejo fuera por cobardia.'
  - 'Vera descuelga las argollas del techo antes de que lleguen las maquinas, se las
    lleva bajo el brazo y dice en voz alta que se retira: no habra ultimo mundial,
    y la frase la dice ella, no el reglamento.'
  - Se quedan sentados en el piso del gimnasio vacio hasta que amanece y entran las
    palas; salen a la calle con las argollas y Ruben le dice que el club nuevo abre
    donde ella quiera, ya sin cargo que perder ni lista que firmar.
  palabras: 142
