escenas:
- id: S001
  capitulo: 1
  fecha: '1978-12-13'
  lugar: Gijon
  presentes:
  - amparo
  - tomas
  resumen: Amparo nada la final de los 200 espalda, baja su marca con el hombro cediendo
    en la ultima vuelta, y despues Tomas le confiesa que la hizo nadar lesionada;
    ella deja su plaza en el club.
  estado: planificada
  cierra:
  - H1
  - H2
  flashback: false
  beats:
  - 'En el poyete, Tomas le pasa el cronometro de mano y la libreta se le abre sola
    por una hoja de 1977: parciales suyos y, al margen, ''hombro - aguanta dos series
    mas''; Amparo la lee y no dice nada'
  - 'En la ultima vuelta el brazo derecho le entra plano; toca la pared con la izquierda,
    Tomas para el cronometro y canta el tiempo en voz alta: medio segundo por debajo
    de su marca, y ella no puede levantar el brazo del agua'
  - Chorreando junto al banco, Tomas admite que esa noche del 77 sabia lo del hombro
    y la mando al agua igual; Amparo le devuelve el gorro del club, le dice al directivo
    con la libreta en la mano que la plaza se la queden para la nueva, y sale con
    el brazo pegado al costado
