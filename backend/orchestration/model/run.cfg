\* TLC para la tirada completa. VER-18. Modelo pequeno.
\* Los numeros del capitulo son los de chapter.cfg: RF-18, CTX-20 y D-37.
\* Chapters, MaxCrashes y MaxAmends son numeros de modelo, no del codigo: acotan
\* el espacio de estados. PlanAttempts = 2 sale de `_plan_with_gate`, que aborta
\* cuando arc_replans > ARC_REPLANS. Las cuatro correcciones del README, activas:
\* son el codigo desde el commit 91a1457.

SPECIFICATION Spec

CONSTANTS
    Scenes = 2
    SceneAttempts = 3
    ChapterAttempts = 2
    ArcReplans = 1
    Ceiling = 100000
    Reserve = 72500
    Jurors = 3
    JuryReserve = 11500
    Chapters = 5
    PlanAttempts = 2
    MaxCrashes = 1
    MaxAmends = 1
    CheckpointOnlyPassed = TRUE
    ResumeSkipsFrozen = TRUE
    ResumeKeepsBudget = TRUE
    RetconKeepsHistory = TRUE

INVARIANTS
    TypeOK
    NeverPublishUngated
    NoChapterDuplicated
    NoChapterLost
    ResumeOnlyClosed
    PreviousVersionPreserved
    RetriesWithinLimit
    ChapterSafety

PROPERTIES
    GenerationTerminates
    AmendmentsSettle
