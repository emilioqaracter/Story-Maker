# Story-Maker - configuracion del harness.
# Los numeros del sistema. Nada los repite (SPEC §1).
# Perfil v1: FIJO. Un documento de 3 parrafos de 4 lineas.

version: 2
perfil: smoke

estructura:
  capitulos: 1
  escenas_por_capitulo: 3      # una por acto: el minimo que cuenta una historia
  parrafos_por_escena: 3
  lineas_por_parrafo: 4
  palabras_por_linea: 12

tolerancia:
  lineas_por_parrafo: 0        # exacto: 4 lineas, ni 3 ni 5
  palabras_por_linea: 3        # 12 +- 3  ->  9..15

# La rubrica ya NO decide si la escena entra: eso lo dice el critico (v9.0).
# Sigue existiendo porque una nota con cita es lo unico que se puede comparar
# entre corridas y entre versiones del prompt. Es medida, no puerta.
rubrica:
  dimensiones: [conflicto, voz, concrecion, frescura, avance]
  niveles: [0, 1, 2]

ciclo:
  intentos_max: 3
  contracciones_max: 2

# La novela es de UN protagonista y sigue la estructura de tres actos. El acto
# de una escena se calcula por su posicion, igual que todo lo demas: no se
# declara en ningun lado.
genero:
  nombre: deportivo
  actos: [planteamiento, desarrollo, desenlace]
  # Que porcentaje del libro ocupa cada acto. Es la proporcion clasica.
  reparto: { planteamiento: 0.25, desarrollo: 0.50, desenlace: 0.25 }
  # Que tiene que pasar en cada uno. Lo comprueba G4 leyendo lo que cierra
  # cada escena; el planner lo usa para saber que planificar.
  exige:
    planteamiento: "queda claro quien es el protagonista, que quiere y que se lo impide"
    desarrollo: "el obstaculo aprieta y el precio sube; algo se pierde por el camino"
    desenlace: "la meta se resuelve, y cuesta lo que se anuncio que iba a costar"
