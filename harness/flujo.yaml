# El flujo declarado: quien trabaja, cuando, con que y contra que regla.
#
# Lo conduce Claude Code siguiendo la skill `dirigir-novela`. La UI lo lanza
# con el mismo prompt; no hay un segundo camino.
# Vive aca y no en la UI para que la pantalla no pueda contar una historia
# distinta de la que corre. La traza real se compara contra esto.

fases:
  - id: arranque
    titulo: "Arranque"
    subtitulo: "una sola vez, antes de escribir una linea"
    pasos:
      - agente: orquestador
        tipo: modelo
        que: "Convierte la idea en las respuestas del canon: deriva lo derivable y pregunta UNA vez solo lo que cambia el libro"
        skill: preparar-libro
        herramientas: [AskUserQuestion]
        nota: "Sustituye a la entrevista de doce preguntas fijas (v8.1). Lo que se calcula no se pregunta; lo que se averigua tampoco."

      - agente: crear_libro.py
        tipo: script
        que: "Escribe el canon inicial con las derivaciones de harness/derivaciones.py"
        escribe: [context/premise.yaml, context/relacion.yaml, context/characters/*.yaml, context/timeline.yaml, context/calendario.yaml, config.yaml]
        nota: "Mismo camino que usa la UI: server.crear(). Un solo sitio donde se deriva."

      - agente: researcher
        tipo: modelo
        que: "Averigua la epoca: que no existia todavia y como se vivia entonces"
        skill: epoca
        herramientas: [WebSearch, WebFetch]
        escribe: [context/epoca.yaml]
        opcional: true
        nota: "Se salta si epoca.yaml ya trae anacronismos. Lo guarda guardar_plan.py: el agente no escribe YAML."

      - agente: planner
        tipo: modelo
        que: "Reparte la historia en escenas respetando los tres actos. No escribe prosa"
        skill: resolver-canon
        lee: [context/premise.yaml, context/relacion.yaml, context/timeline.yaml]
        escribe: [context/timeline.yaml]
        nota: "Devuelve resumen y beats; los guarda guardar_plan.py, que solo toca esos dos campos."

      - agente: validate_canon.py
        tipo: script
        puerta: G0
        que: "El canon esta completo, el arco tiene sus tres actos y el plan cabe"
        reglas: [V21, V13, "V16 arco", "plan cabe"]
        si_falla: "no se escribe una sola linea de prosa"

  - id: producir
    titulo: "Produccion"
    subtitulo: "una vuelta por escena, hasta 3 intentos"
    pasos:
      - agente: resolver_canon.py
        tipo: script
        que: "Resuelve el canon a la fecha de la escena y lo entrega EN PROSA"
        nota: "Nadie interpreta YAML. De aca sale todo lo que el escritor sabe."

      - agente: escritor
        tipo: modelo
        que: "Escribe la escena con la forma exacta que pide el canon"
        skill: escribir-escena
        herramientas: []
        escribe: [manuscript/chNN/SNNN.md]
        nota: "Devuelve prosa; el archivo lo escribe el script."

      - agente: validate_scene.py
        tipo: script
        puerta: G1
        que: "Los hechos: fechas, edades, estados, anacronismos y la forma"
        reglas: ["V1-V9", V14, V15, V16, V20]
        si_falla: "vuelve al corrector, sin gastar critica"

      - agente: critico-continuidad
        tipo: modelo
        que: "Contradicciones con el canon que un script no puede formalizar"
        skill: formato-critica
        herramientas: []
        escribe: [manuscript/chNN/SNNN.critique.json]
        nota: "Contexto aislado: no ve al otro critico ni sabe en que intento va."

      - agente: critico-calidad
        tipo: modelo
        que: "Puntua la rubrica de cinco dimensiones, con cita obligatoria"
        skill: formato-critica
        herramientas: []
        escribe: [manuscript/chNN/SNNN.critique.json]

      - agente: gate_scene.py
        tipo: script
        puerta: G2
        que: "Releva el veredicto del critico y comprueba que sea utilizable"
        reglas: ["veredicto con motivo", "veto de continuidad", "cita en toda nota", "critica al dia"]
        nota: "Desde la v9.0 decide el critico; este script ya no suma ni compara umbrales."
        si_falla: "vuelve al corrector con los errores concretos"

      - agente: corrector
        tipo: modelo
        que: "Toca SOLO lo que senalan los errores"
        skill: corregir-escena
        herramientas: []
        solo_si: "G1 o G2 cerraron"

      - agente: run_scene.py
        tipo: script
        que: "Marca aprobada, recuenta y comprueba que el final siga cabiendo"
        nota: "Al cerrar capitulo avisa G3."

      - agente: lector-capitulo
        tipo: modelo
        que: "Lee el capitulo seguido y senala lo que no se ve escena por escena"
        herramientas: [Read]
        solo_si: "la escena aprobada cierra un capitulo"
        nota: "Devuelve hallazgos con cita. No decide si el capitulo pasa."

      - agente: gate_chapter.py
        tipo: script
        puerta: G3
        que: "Aplica el umbral del capitulo sobre la lectura"
        reglas: ["escenas aprobadas", "presupuesto del capitulo", "cita que exista", "sin hallazgos bloqueantes"]
        si_falla: "las escenas senaladas vuelven al bucle de correccion"

  - id: cierre
    titulo: "Cierre"
    subtitulo: "una sola vez, cuando no queda escena sin aprobar"
    pasos:
      - agente: validate_book.py
        tipo: script
        puerta: G4
        que: "Las tres condiciones del final"
        reglas: [V10, V11, V12, "V17 tres actos", "V18 desenlace", C1, C2, C3]
        si_falla: "replanifica lo que falte cerrar y vuelve al bucle"

      - agente: reportar.py
        tipo: script
        que: "Manda a Langfuse la vista por escena: intentos, puertas y rubrica como scores"
        opcional: true
        nota: "Sin claves en .env no hace nada. El hook de Claude Code cuenta la otra mitad: la conversacion."

      - agente: compilar.py
        tipo: script
        que: "Concatena las escenas aprobadas en novela.md"
        escribe: [manuscript/novela.md]
