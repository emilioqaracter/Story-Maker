# Engancha las comprobaciones rapidas antes de cada commit.
#
# Aqui van solo las que tardan menos de un segundo. Las pruebas NO estan a
# proposito: tardan medio minuto y un enganche que se hace esperar es un
# enganche que la gente desactiva, con lo que se pierde tambien lo barato.
# De las pruebas se encarga la integracion continua, que es donde el tiempo
# de espera no lo paga nadie.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^backend/
        args: [--config-file=backend/pyproject.toml]
        additional_dependencies: [pydantic>=2.9]

  - repo: local
    hooks:
      # Las fronteras entre carpetas van como enganche local porque necesitan
      # los paquetes importables, no solo los ficheros.
      - id: fronteras
        name: fronteras entre carpetas
        entry: bash -c 'cd backend && lint-imports'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
