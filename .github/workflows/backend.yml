name: backend

# Existe para que "la puerta pasa" deje de significar "paso cuando la ejecute
# alguien". Mientras la puerta fue una lista de comandos a mano, bastaba
# olvidarse de uno para que entrara codigo roto sin que nadie se enterara.

on:
  push:
    branches: [main, v2, v2-oneshot]
    paths: ["backend/**", "docs/**", "specs/**", "AGENTS.md", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docs/**", "specs/**", "AGENTS.md", ".github/workflows/backend.yml"]
  schedule:
    # Lo lento, una vez al dia: tarda minutos y correria decenas de veces
    # al dia sin encontrar nada nuevo.
    - cron: "0 3 * * *"

defaults:
  run:
    working-directory: backend

jobs:
  puerta:
    name: Puerta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Puerta
        run: python gate.py

  lento:
    name: Comprobaciones lentas
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Auditoria de dependencias: contrasta lo instalado contra
      # vulnerabilidades publicadas. Cambia sin que el codigo cambie, por eso
      # va por calendario y no por commit.
      - name: Puerta completa
        run: python gate.py --full

      # Pruebas de mutacion sobre los verificadores deterministas, y solo
      # sobre ellos. Estropean el codigo a proposito --cambian un `<` por un
      # `<=`-- y comprueban que alguna prueba se entera. Si nadie se entera,
      # esa prueba no vale nada.
      #
      # Corren AQUI y no en la puerta local por dos motivos: tardan minutos, y
      # la herramienta no funciona de forma nativa en Windows, que es donde se
      # desarrolla. Este trabajo corre en Linux, asi que es su sitio.
      # Model checking del ciclo de vida del capitulo (VER-18). TLC prueba el
      # flujo modelado; la distancia con el orquestador la cubre VER-05.
      - name: Model checking del ciclo del capitulo
        run: |
          curl -sSL -o /tmp/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
          cd orchestration/model && java -XX:+UseParallelGC -jar /tmp/tla2tools.jar -workers auto -config chapter.cfg chapter.tla

      - name: Mutacion sobre los verificadores
        run: |
          python -m mutmut run --max-children 4 || true
          python -m mutmut results
          python - <<'EOF'
          import subprocess, sys, re
          out = subprocess.run([sys.executable, "-m", "mutmut", "results"],
                               capture_output=True, text=True).stdout
          vivos = len(re.findall(r"survived", out))
          muertos = len(re.findall(r"killed", out))
          total = vivos + muertos
          if total:
              cobertura = muertos / total
              print(f"cobertura de mutacion: {cobertura:.0%} ({muertos}/{total})")
              # RF-50 pide 90 %. Se falla el trabajo por debajo.
              sys.exit(0 if cobertura >= 0.90 else 1)
          EOF
