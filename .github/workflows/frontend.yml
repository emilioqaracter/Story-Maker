name: frontend

# La puerta del frontend en cada cambio (spec srs-frontend-v1 §7.2). Se dispara
# tambien con backend/openapi.json: un cambio incompatible del backend tiene que
# romper la compilacion del frontend en la misma entrega (architecture.md §2.2).

on:
  push:
    branches: [main, v2, v2-oneshot]
    paths: ["frontend/**", "backend/openapi.json", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/openapi.json", ".github/workflows/frontend.yml"]
  schedule:
    # La auditoria de dependencias cambia sin que el codigo cambie: una vez al dia.
    - cron: "0 3 * * *"

defaults:
  run:
    working-directory: frontend

jobs:
  puerta:
    name: Puerta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar
        run: npm ci

      - name: Puerta
        run: node gate.mjs ${{ github.event_name == 'schedule' && '--full' || '' }}
